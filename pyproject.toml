[project]
name = "dacpactools"
version = "0.1.0"
description = "DacPac + Azure SQL object-to-base-table column lineage"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Wessel van der Linden", email = "wesselvdlinden@gmail.com" }]
dependencies = [
    "click>=8.1",
    "pythonnet>=3.0.3",
    "azure-identity>=1.17",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
openlineage-client = ["openlineage-python>=1.15"]

[project.scripts]
dacpactools = "dacpactools.presentation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dacpactools"]

[tool.hatch.build.targets.wheel.force-include]
"src/dacpactools/infrastructure/viz/templates" = "dacpactools/infrastructure/viz/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "dotnet: requires CLR + DacFx assemblies loaded",
    "azure: requires live Azure SQL and env-configured credentials",
]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["dacpactools"]
